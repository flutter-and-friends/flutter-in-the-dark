name: flutter_in_the_dark_room_service
description: >-
  Room-state service for Flutter in the Dark, "Prompting in the Dark".
  Replaces Firebase:
  holds the whole room (challenge, challengers, show state, admin view
  overrides) in memory, streams it to clients over SSE, accepts client actions
  as POSTs, and drives the per-challenger generate/compile/fix pipeline against
  the dart_services fork. Deliberately separate from dart_services (different
  crash/scaling profiles).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  args: ^2.7.0
  http: ^1.2.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  uuid: ^4.5.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
