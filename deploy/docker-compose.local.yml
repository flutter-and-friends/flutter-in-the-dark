# LOCAL / DEV-HOST override for the fitd26 stack.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.local.yml up -d
#
# What changes vs production:
#   - NO TLS, NO ACME, NO DNS — plain HTTP on 127.0.0.1:8080.
#   - Loopback (127.0.0.1:4443) stands in for the tailnet entrypoint
#     (Traefik serves it over plain HTTP locally; same router set).
#   - Host routing is dropped (single hostname: localhost).
#
# The structural gate is UNCHANGED and still verifiable:
#   public  :8080  → /admin and /api/admin/* 404 (no router)
#   "tailnet" :4443 → /admin and /api/admin/* work
#
# TAILSCALE_IP / ACME_EMAIL are NOT needed here. DOMAIN/TAILNET_DOMAIN are
# irrelevant (rules below match any host).

services:
  traefik:
    command:
      - --api.insecure=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # No websecure/ACME locally.
      - --entrypoints.tailnet.address=:4443
      - --log.level=INFO
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:4443:4443"
    volumes:
      # Drop the tailnet TLS file-config + certs: plain HTTP locally.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-public-static.rule=PathRegexp(`^/(?!admin(/|$))(assets|canvaskit|icons)(/|$)|^/(?!admin(/|$))[^/]*\.[a-zA-Z0-9]+$`)
      - traefik.http.routers.app-public-static.priority=15
      - traefik.http.routers.app-public-static.entrypoints=web
      - traefik.http.routers.app-public.rule=Path(`/`) || PathPrefix(`/show`)
      - traefik.http.routers.app-public.priority=10
      - traefik.http.routers.app-public.entrypoints=web
      - traefik.http.routers.app-admin.rule=PathPrefix(`/`)
      - traefik.http.routers.app-admin.priority=1
      - traefik.http.routers.app-admin.entrypoints=tailnet
      - traefik.http.services.app.loadbalancer.server.port=80

  room:
    labels:
      - traefik.enable=true
      - traefik.http.routers.room-public.rule=Path(`/api/state`) || Path(`/api/events`) || Path(`/api/join`) || Path(`/api/prompt`) || Path(`/api/probe-generate`)
      - traefik.http.routers.room-public.priority=100
      - traefik.http.routers.room-public.entrypoints=web
      - traefik.http.routers.room-admin.rule=PathPrefix(`/api`) && !PathPrefix(`/api/v3`)
      - traefik.http.routers.room-admin.priority=100
      - traefik.http.routers.room-admin.entrypoints=tailnet
      - traefik.http.services.room.loadbalancer.server.port=8302

  dart-services:
    labels:
      - traefik.enable=true
      - traefik.http.routers.dart-services-public.rule=Path(`/api/v3/generateCode`) || Path(`/api/v3/compileAndServe`) || Path(`/api/v3/suggestFix`) || PathPrefix(`/compiled`) || PathPrefix(`/artifacts`)
      - traefik.http.routers.dart-services-public.priority=100
      - traefik.http.routers.dart-services-public.entrypoints=web
      - traefik.http.routers.dart-services-admin.rule=Path(`/api/v3/generateCode`) || Path(`/api/v3/compileAndServe`) || Path(`/api/v3/suggestFix`) || PathPrefix(`/compiled`) || PathPrefix(`/artifacts`)
      - traefik.http.routers.dart-services-admin.priority=100
      - traefik.http.routers.dart-services-admin.entrypoints=tailnet
      - traefik.http.services.dart-services.loadbalancer.server.port=8300
