# Flutter in the Dark SPA vhost — static files + SPA deep-link fallback.
#
# Reached ONLY for paths Traefik did not route to an API backend
# (the API routers run at priority 100, this is the priority-1 catch-all —
# I-114: the fallback must never see /api|/compiled|/artifacts traffic).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build artifacts are immutable; HTML and the service worker are not.
    # NOTE: flutter build web does NOT hash main.dart.js / flutter.js / flutter_bootstrap.js
    # — their filenames are stable across builds, so an immutable year-long cache here
    # means Cloudflare (and browsers) keep serving the PREVIOUS deploy's bundle
    # (WI-006: the c74686c ticker never reached users for exactly this reason).
    # Only content-hashed assets get the immutable treatment.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Unhashed top-level JS entrypoints — revalidate every load. The deploy is
    # cheap (etag), correctness beats a year of stale bundles.
    location ~* ^/(main\.dart|flutter|flutter_bootstrap)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Fonts/images are content-hashed by the Flutter build → safe to cache forever.
    location ~* \.(woff2?|png|jpe?g|svg|gif|webp|otf|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
    }
}
