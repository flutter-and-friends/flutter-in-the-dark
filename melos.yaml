name: flutter_in_the_dark

packages:
  - apps/**

command:
  bootstrap:
    environment:
      sdk: ">=3.5.0 <4.0.0"
    dependencies:
      ff_card:
        git:
          url: https://github.com/lohnn/flutter_and_friends_speaker_cards.git
          path: ff_card
      flutter:
        sdk: flutter
      flutter_hooks: ^0.21.1-pre.4
    dev_dependencies:
      flutter_lints: ^4.0.0
      flutter_test:
        sdk: flutter

scripts:
  build_web:
    # Bakes the build-version marker (git short hash + UTC timestamp) so the
    # console log / admin chip show real values outside Docker too. A plain
    # `flutter run`/`flutter build web` without the defines falls back to
    # the app's `dev` marker — never a crash.
    run: |
      melos exec -- flutter build web \
        --dart-define=GIT_HASH=$(git rev-parse --short HEAD) \
        --dart-define=BUILD_TIME=$(date -u +%Y-%m-%dT%H:%MZ)
  fix:
    run: melos exec -- dart fix --apply
  upgrade:
    run: melos exec -- flutter pub upgrade
    description: Upgrade to the latest supported versions of all packages.
